<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saree lookup — Pavnika by Saranya</title>
<link rel="manifest" href="/scan-manifest.json">
<link rel="apple-touch-icon" href="/assets/scan-icon-192.png">
<meta name="theme-color" content="#fff8f5">
<style>
  :root {
    --bg: #fff8f5; --text: #2a1a14; --text-secondary: #8a7266; --text-muted: #aaa;
    --border: #ddd; --border-strong: #999; --surface: #fafaf8; --surface-0: #f5f5f3;
    --ivory-deep: #efe8e2; --stone: #d4cec6; --gold: #B68A69;
    --gold-light: #e8ddd4; --gold-tint: #f5ede4; --maroon: #B8142A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1410; --text: #faf8f5; --text-secondary: #b8a89f; --text-muted: #666;
      --border: #444; --border-strong: #666; --surface: #252019; --surface-0: #2d2620;
      --ivory-deep: #3d3530; --stone: #5a5450; --gold: #d4a376;
      --gold-light: #4a4038; --gold-tint: #332a23; --maroon: #ff6b7a;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; }

  .card { background: var(--surface); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 0.5px solid var(--border); }
  h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  .msg { padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: none; }
  .msg.info { background: #e3f2fd; color: #1565c0; }
  .msg.error { background: #ffebee; color: #c62828; }
  .msg.success { background: #e8f5e9; color: #2e7d32; }

  #video-wrap {
    position: relative; width: 100%; height: 0; background: var(--ivory-deep);
    border-radius: 8px; overflow: hidden; margin-bottom: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #video-wrap.scanning { height: 170px; margin-bottom: 10px; }
  #video-wrap video { width: 100%; height: 100%; object-fit: cover; }
  #scan-line {
    position: absolute; left: 12%; right: 12%; height: 2px; background: #B8142A;
    top: 50%; display: none; box-shadow: 0 0 8px rgba(184,20,42,0.6);
  }
  #video-wrap.scanning #scan-line { display: block; }

  /* Distance hint badge */
  #distance-hint {
    padding: 8px 12px; border-radius: 6px; font-size: 0.78rem; text-align: center;
    font-weight: 600; display: none; margin-bottom: 10px;
  }
  #distance-hint.visible { display: block; }
  #distance-hint.too-close { background: #FBEAEA; color: #B8142A; }
  #distance-hint.good { background: #EAF3DE; color: #3B6D11; }
  #distance-hint.too-far { background: #FFF3E0; color: #E8A91F; }

  /* Image quality meter */
  #image-quality {
    display: none; background: var(--surface-0); border-radius: 8px; padding: 12px;
    margin-bottom: 10px; gap: 12px; flex-direction: column;
  }
  #image-quality.visible { display: flex; }
  #sharpness-bar {
    height: 6px; background: #ddd; border-radius: 3px; overflow: hidden;
  }
  #sharpness-fill {
    height: 100%; width: 0%; background: #3B6D11; transition: width 0.3s;
  }
  #sharpness-fill.low { background: #B8142A; }
  #sharpness-fill.medium { background: #E8A91F; }
  #sharpness-fill.high { background: #3B6D11; }
  #quality-label {
    font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #8a7266;
    text-align: center; min-height: 14px;
  }

  button { padding: 10px 16px; background: var(--gold); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  button.btn-primary { background: var(--maroon); }
  input { padding: 10px 12px; border: 0.5px solid var(--border); border-radius: 6px; width: 100%; }

  #history-wrap { margin-top: 20px; }
  #history-list { list-style: none; }
  .hist-item { padding: 12px; background: var(--surface-0); border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
  .h-code { font-weight: 600; font-family: monospace; }
  .h-price { color: var(--text-secondary); font-size: 12px; }
</style>
</head>
<body>

  <div class="card">
    <h2>Saree lookup</h2>
    <p class="msg" id="msg"></p>

    <div id="distance-hint"></div>

    <div id="video-wrap">
      <video id="video" playsinline style="display:none;"></video>
      <div id="scan-line"></div>
    </div>

    <div id="image-quality">
      <div style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #8a7266;">Focus Quality</div>
      <div id="sharpness-bar">
        <div id="sharpness-fill"></div>
      </div>
      <div id="quality-label"></div>
    </div>

    <button type="button" class="btn-primary" id="camera-btn">Start camera</button>

    <div style="border-top: 0.5px solid var(--border); padding-top: 12px; margin-top: 12px;">
      <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; text-align: center;">Or enter the code</p>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="manual-input" placeholder="e.g. PP002">
        <button type="button" id="manual-btn" style="width: auto;">Find</button>
      </div>
    </div>
  </div>

  <div id="history-wrap" style="display:none;">
    <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">Recent lookups</h3>
    <ul id="history-list"></ul>
    <button type="button" id="hist-clear" style="width: 100%; margin-top: 10px;">Clear history</button>
  </div>

  <script src="/zxing.min.js"></script>
  <script src="/products-data.js"></script>
  <script>
    var videoEl = document.getElementById('video');
    var cameraBtn = document.getElementById('camera-btn');
    var manualInput = document.getElementById('manual-input');
    var msgEl = document.getElementById('msg');
    var videoWrap = document.getElementById('video-wrap');
    var historyWrap = document.getElementById('history-wrap');
    var historyList = document.getElementById('history-list');
    var scanning = false;
    var codeReader = null;

    function showMsg(type, text) {
      msgEl.className = 'msg ' + type;
      msgEl.textContent = text;
      msgEl.style.display = 'block';
    }
    function clearMsg() { msgEl.style.display = 'none'; }

    function playBeep() {
      try {
        var audioContext = new (window.AudioContext || window.webkitAudioContext)();
        var oscillator = audioContext.createOscillator();
        var gain = audioContext.createGain();
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.frequency.value = 800;
        oscillator.type = 'sine';
        gain.gain.setValueAtTime(0.2, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.1);
      } catch (e) {}
    }

    function ensureAudioContext() {
      try {
        new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {}
    }

    function lookup(code) {
      if (!code || !code.trim()) return false;
      code = code.trim().toUpperCase();
      var item = window.PRODUCTS.find(function (p) { return p.id === code; });
      if (!item) {
        showMsg('error', 'Saree not found. Try another code.');
        return false;
      }
      clearMsg();
      saveHistory(code);
      var details = '<strong>' + (item.occasion ? item.occasion + ' • ' : '') + item.name + '</strong><br>';
      if (item.price) details += 'AED ' + item.price + '<br>';
      if (item.status && item.status !== 'Available') details += '<span style="color: #B8142A;">' + item.status + '</span>';
      showMsg('success', details);
      return true;
    }

    function saveHistory(code) {
      var history = JSON.parse(localStorage.getItem('scan-history') || '[]');
      history = history.filter(function (c) { return c !== code; });
      history.unshift(code);
      history = history.slice(0, 10);
      localStorage.setItem('scan-history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      var history = JSON.parse(localStorage.getItem('scan-history') || '[]');
      if (history.length === 0) {
        historyWrap.style.display = 'none';
        return;
      }
      historyWrap.style.display = 'block';
      historyList.innerHTML = history.map(function (code) {
        var item = window.PRODUCTS.find(function (p) { return p.id === code; });
        if (!item) return '';
        return '<li class="hist-item" data-id="' + code + '">' +
          '<div class="h-code">' + code + '</div>' +
          '<div style="font-size: 12px; color: var(--text-secondary);">' + (item.name || 'Unknown') + '</div>' +
          (item.price ? '<div class="h-price">AED ' + item.price + '</div>' : '') +
          '</li>';
      }).join('');
      historyList.querySelectorAll('.hist-item').forEach(function (el) {
        el.addEventListener('click', function () { lookup(el.getAttribute('data-id')); });
      });
    }

    document.getElementById('hist-clear').addEventListener('click', function () {
      localStorage.setItem('scan-history', '[]');
      renderHistory();
    });

    document.getElementById('manual-btn').addEventListener('click', function () {
      lookup(manualInput.value);
    });
    manualInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); lookup(manualInput.value); }
    });

    // Image quality analysis
    var imageQualityEl = document.getElementById('image-quality');
    var sharpnessFillEl = document.getElementById('sharpness-fill');
    var qualityLabelEl = document.getElementById('quality-label');
    var distanceHintEl = document.getElementById('distance-hint');
    var qualityCheckInterval = null;

    function stopCamera() {
      scanning = false;
      if (codeReader) { try { codeReader.reset(); } catch (e) {} }
      videoEl.style.display = 'none';
      videoWrap.classList.remove('scanning');
      cameraBtn.textContent = 'Start camera';
      imageQualityEl.classList.remove('visible');
      if (qualityCheckInterval) clearInterval(qualityCheckInterval);
    }

    function analyzeImageQuality() {
      if (!scanning || !videoEl.videoWidth) return;
      try {
        var canvas = document.createElement('canvas');
        canvas.width = videoEl.videoWidth;
        canvas.height = videoEl.videoHeight;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(videoEl, 0, 0);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var data = imageData.data;

        // Blur detection via Laplacian variance
        var variance = 0, count = 0, width = canvas.width;
        for (var y = 1; y < canvas.height - 1; y += 4) {
          for (var x = 1; x < width - 1; x += 4) {
            var idx = (y * width + x) * 4;
            if (idx >= data.length) break;
            var neighbors = [];
            for (var dy = -1; dy <= 1; dy++) {
              for (var dx = -1; dx <= 1; dx++) {
                var nIdx = ((y + dy) * width + (x + dx)) * 4;
                if (nIdx >= 0 && nIdx < data.length) {
                  var g = data[nIdx] * 0.299 + data[nIdx + 1] * 0.587 + data[nIdx + 2] * 0.114;
                  neighbors.push(g);
                }
              }
            }
            if (neighbors.length === 9) {
              var lap = -neighbors[0] - neighbors[1] - neighbors[2] - neighbors[3] + 8 * neighbors[4] - neighbors[5] - neighbors[6] - neighbors[7] - neighbors[8];
              variance += lap * lap;
              count++;
            }
          }
        }
        var sharpness = count > 0 ? Math.sqrt(variance / count) / 1000 : 0;
        sharpness = Math.min(100, sharpness);
        
        sharpnessFillEl.style.width = sharpness + '%';
        sharpnessFillEl.className = '';
        if (sharpness < 30) {
          sharpnessFillEl.classList.add('low');
          qualityLabelEl.textContent = 'Very blurry — try to steady';
        } else if (sharpness < 60) {
          sharpnessFillEl.classList.add('medium');
          qualityLabelEl.textContent = 'Slightly blurry — hold steady';
        } else {
          sharpnessFillEl.classList.add('high');
          qualityLabelEl.textContent = 'Sharp — ready to scan';
        }

        // Distance detection
        var darkPixels = 0;
        for (var i = 0; i < data.length; i += 4) {
          if ((data[i] + data[i+1] + data[i+2]) / 3 < 100) darkPixels++;
        }
        var darkRatio = darkPixels / (data.length / 4);
        
        if (darkRatio < 0.1) {
          distanceHintEl.className = 'visible too-far';
          distanceHintEl.textContent = 'Too far — move closer';
        } else if (darkRatio > 0.4) {
          distanceHintEl.className = 'visible too-close';
          distanceHintEl.textContent = 'Too close — move back';
        } else {
          distanceHintEl.className = 'visible good';
          distanceHintEl.textContent = 'Good distance';
        }
      } catch (e) {}
    }

    cameraBtn.addEventListener('click', function () {
      ensureAudioContext();
      if (scanning) { stopCamera(); clearMsg(); return; }

      if (typeof ZXing === 'undefined') {
        showMsg('error', 'Scanner did not load. Type code below instead.');
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showMsg('error', 'Camera not available. Type code below instead.');
        return;
      }

      scanning = true;
      cameraBtn.textContent = 'Stop camera';
      videoEl.style.display = 'block';
      videoWrap.classList.add('scanning');
      showMsg('info', 'Hold barcode steady and well-lit.');

      codeReader = new ZXing.BrowserMultiFormatReader();
      codeReader.decodeFromConstraints(
        { video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] } },
        videoEl,
        function (result, err) {
          if (result) {
            var text = result.getText ? result.getText() : result.text;
            if (text && lookup(text)) {
              stopCamera();
              playBeep();
              if (navigator.vibrate) navigator.vibrate(60);
            }
          }
        }
      ).then(function () {
        imageQualityEl.classList.add('visible');
        qualityCheckInterval = setInterval(analyzeImageQuality, 500);
      }).catch(function (e) {
        scanning = false;
        cameraBtn.textContent = 'Start camera';
        videoEl.style.display = 'none';
        videoWrap.classList.remove('scanning');
        if (e.name === 'NotAllowedError') {
          showMsg('error', 'Camera permission denied. Type code below instead.');
        } else {
          showMsg('error', 'Could not start camera. Type code below instead.');
        }
      });
    });

    renderHistory();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/scan-sw.js').catch(function () {});
    }
  </script>

</body>
</html>
